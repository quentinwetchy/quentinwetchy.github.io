<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quentin — Grafikdesign</title>
  <meta name="description" content="Grafikdesign, Konzertposter und visuelle Arbeiten von Quentin.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Ctext x='6' y='24' fill='white' font-size='25' font-family='Arial'%3EQ%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: white; color: #161616; font-family: Arial, Helvetica, sans-serif; }
    header { max-width: 1440px; margin: auto; padding: 56px 48px 40px; display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
    .name { color: inherit; text-decoration: none; font-size: 24px; font-weight: 700; letter-spacing: -.7px; }
    nav { display: flex; gap: 28px; }
    nav a, footer a { color: inherit; text-underline-offset: 5px; font-size: 16px; }
    nav a { text-decoration: none; }
    nav a:hover, nav a:focus-visible { text-decoration: underline; }
    main { max-width: 1440px; margin: auto; padding: 0 48px; }
    h1 { margin: 0 0 26px; font-size: 16px; font-weight: 400; }
    .gallery { columns: 3; column-gap: 22px; }
    .work { display: block; width: 100%; padding: 0; margin: 0 0 22px; border: 0; background: #f1f1f1; cursor: zoom-in; break-inside: avoid; }
    .work img { display: block; width: 100%; height: auto; }
    .placeholder { display: flex; min-height: 320px; padding: 32px; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #555; font-size: 16px; }
    .placeholder small { font-size: 14px; overflow-wrap: anywhere; }
    .work:nth-child(2n) .placeholder { min-height: 440px; }
    .work:disabled { cursor: default; }
    footer { max-width: 1440px; margin: 64px auto 0; padding: 36px 48px 56px; border-top: 1px solid #ddd; }
    footer h2 { margin: 0 0 16px; font-size: 20px; }
    footer p { font-size: 16px; line-height: 1.6; }
    body.viewer-open { overflow: hidden; }
    dialog { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; border: 0; padding: 0; background: transparent; color: #161616; }
    dialog::backdrop { background: rgb(255 255 255 / .48); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .viewer { position: absolute; inset: 65px 70px 55px; margin: 0; display: grid; place-items: center; touch-action: pan-y; }
    .viewer img { position: absolute; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 550ms ease; pointer-events: none; }
    .viewer img.visible { opacity: 1; }
    .caption { position: absolute; bottom: 16px; left: 60px; right: 60px; text-align: center; margin: 0; font-size: 14px; }
    .close, .previous, .next { position: absolute; z-index: 2; background: rgb(255 255 255 / .8); color: #161616; border: 0; min-width: 44px; min-height: 44px; padding: 8px; cursor: pointer; }
    .close { right: 16px; top: 12px; font-size: 16px; }
    .previous, .next { top: calc(50% - 22px); font-size: 34px; font-weight: 300; line-height: 1; }
    .previous { left: 10px; } .next { right: 10px; }
    .previous:disabled, .next:disabled { visibility: hidden; }
    :focus-visible { outline: 3px solid #3868d9; outline-offset: 5px; }
    @media (max-width: 900px) { .gallery { columns: 2; } header { padding-top: 36px; } }
    @media (max-width: 560px) { header { padding: 28px 20px 32px; flex-wrap: wrap; } main { padding: 0 20px; } .gallery { columns: 1; } footer { padding: 28px 20px 40px; } .name { font-size: 22px; } }
    @media (max-width: 560px) { .viewer { inset: 65px 45px 65px; } .previous { left: 0; } .next { right: 0; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .viewer img { transition: none; } }
  </style>
</head>
<body>
  <header>
    <!-- Deinen vollständigen Namen hier eintragen. -->
    <a class="name" href="./">QUENTIN</a>
    <nav aria-label="Hauptnavigation"><a href="#arbeiten">Work</a><a href="#kontakt">Contact</a></nav>
  </header>
  <main id="arbeiten">
    <h1>Graphic Design</h1>
    <div class="gallery" id="gallery"></div>
    <noscript>Bitte aktiviere JavaScript, um die Bildergalerie zu sehen.</noscript>
  </main>
  <footer id="kontakt">
    <h2>Kontakt</h2>
    <p>Quentin · Grafikdesign · Wien</p>
    <!-- Durch deine echte E-Mail ersetzen und den Link wieder aktivieren:
    <a href="mailto:deine@email.at">deine@email.at</a>
    -->
    <p>E-Mail-Adresse folgt.</p>
  </footer>
  <dialog id="lightbox" aria-label="Vergrößerte Arbeit">
    <button class="close" type="button" autofocus>Schließen ×</button>
    <button class="previous" type="button" aria-label="Vorherige Arbeit">‹</button>
    <div class="viewer"><img alt="" aria-hidden="true"><img alt="" aria-hidden="true"></div>
    <button class="next" type="button" aria-label="Nächste Arbeit">›</button>
    <p class="caption" aria-live="polite"></p>
  </dialog>
  <script>
    // HIER DEINE ARBEITEN EINTRAGEN.
    // Bilder in den Ordner "bilder" legen. Groß-/Kleinschreibung beachten.
    // Jede Zeile entspricht einem Bild; Reihenfolge hier ändern.
    const works = [
      { image: 'bilder/arbeit-01.jpg', title: 'Konzertposter 01' },
      { image: 'bilder/arbeit-02.jpg', title: 'Konzertposter 02' },
      { image: 'bilder/arbeit-03.jpg', title: 'Coverdesign' },
      { image: 'bilder/arbeit-04.jpg', title: 'Konzertposter 03' },
      { image: 'bilder/arbeit-05.jpg', title: 'Merchdesign' },
      { image: 'bilder/arbeit-06.jpg', title: 'Visuelle Gestaltung' }
    ];
    const gallery = document.querySelector('#gallery');
    const lightbox = document.querySelector('#lightbox');
    const layers = [...lightbox.querySelectorAll('.viewer img')];
    const previous = lightbox.querySelector('.previous');
    const next = lightbox.querySelector('.next');
    const caption = lightbox.querySelector('.caption');
    const available = new Set(works.map((_, index) => index));
    let activeIndex = 0, activeLayer = 0, requestId = 0, busy = false;
    function updateControls() {
      const indices = [...available].sort((a, b) => a - b);
      previous.disabled = indices.indexOf(activeIndex) <= 0;
      next.disabled = indices.indexOf(activeIndex) >= indices.length - 1;
    }
    async function showWork(index, initial = false) {
      const id = ++requestId;
      busy = true;
      const work = works[index];
      const preload = new Image(); preload.src = work.image;
      try { await preload.decode(); } catch {
        if (id === requestId) { busy = false; caption.textContent = 'Bild konnte nicht geladen werden.'; }
        return;
      }
      if (id !== requestId || !lightbox.open) return;
      const target = initial ? activeLayer : 1 - activeLayer;
      layers[target].src = work.image;
      layers[target].alt = work.title;
      if (initial) layers.forEach(layer => layer.classList.remove('visible'));
      // Erst die neue Ebene rendern, dann beide Ebenen weich überblenden.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (id !== requestId || !lightbox.open) return;
        layers[target].classList.add('visible');
        layers[1 - target].classList.remove('visible');
        layers[target].setAttribute('aria-hidden', 'false');
        layers[1 - target].setAttribute('aria-hidden', 'true');
        activeLayer = target; activeIndex = index;
        caption.textContent = work.title;
        updateControls();
        busy = false;
      }));
    }
    function navigate(direction) {
      if (busy) return;
      const indices = [...available].sort((a, b) => a - b);
      const index = indices[indices.indexOf(activeIndex) + direction];
      if (index !== undefined) showWork(index);
    }
    works.forEach((work, index) => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'work';
      button.setAttribute('aria-label', work.title + ' vergrößern');
      const img = document.createElement('img');
      img.alt = work.title; img.loading = 'lazy'; img.decoding = 'async';
      img.addEventListener('error', () => {
        available.delete(index); if (lightbox.open) updateControls();
        const placeholder = document.createElement('span');
        placeholder.className = 'placeholder';
        const label = document.createElement('span'); label.textContent = 'Hier kommt deine Arbeit hin';
        const file = document.createElement('small'); file.textContent = work.image;
        placeholder.append(label, file); button.replaceChildren(placeholder); button.disabled = true;
      }, { once: true });
      img.addEventListener('load', () => { available.add(index); if (lightbox.open) updateControls(); });
      img.src = work.image;
      button.append(img);
      button.addEventListener('click', () => {
        available.add(index); activeIndex = index;
        lightbox.showModal(); document.body.classList.add('viewer-open');
        updateControls(); showWork(index, true);
      });
      gallery.append(button);
    });
    lightbox.querySelector('.close').addEventListener('click', () => lightbox.close());
    previous.addEventListener('click', () => navigate(-1));
    next.addEventListener('click', () => navigate(1));
    lightbox.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault(); navigate(event.key === 'ArrowRight' ? 1 : -1);
      }
    });
    lightbox.addEventListener('close', () => {
      ++requestId; busy = false; document.body.classList.remove('viewer-open');
      layers.forEach(layer => layer.classList.remove('visible'));
    });
    lightbox.addEventListener('click', event => { if (event.target === lightbox) lightbox.close(); });
    let touchStart = null;
    const stage = lightbox.querySelector('.viewer');
    stage.addEventListener('touchstart', event => {
      if (event.touches.length === 1) touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
      else touchStart = null;
    }, { passive: true });
    stage.addEventListener('touchend', event => {
      if (!touchStart) return;
      const dx = event.changedTouches[0].clientX - touchStart.x;
      const dy = event.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) navigate(dx < 0 ? 1 : -1);
    }, { passive: true });
    stage.addEventListener('touchcancel', () => { touchStart = null; });
  </script>
</body>
</html>
